<!DOCTYPE html>
<html>

<head>
<style>

#tableContainer {
	border: 1px solid black;
	padding: 10px;
	padding-top: 0px;
	display: inline-block; /* only take up as much space as needed to fit elements inside */
	border-radius: 15px;
}

table {
	border-collapse: collapse; /* no spacing in between cells, necessary for borders around rows */
}

th, td {
	text-align: center;
	padding: 20px;
}

tbody {
	border-bottom: 1px solid black; /* table needs to have border-collapse set to collapse to be able to use borders here */
	border-left: 1px solid black;
	border-right: 1px solid black;
	border-radius: 5px;
}




</style>
</head>

<body>

<div id="tableContainer">
	<table>
		<thead>
			<tr>
				<th colspan="3">test</th>
			</tr>
		</thead>
		<tbody>
			<tr>
				<th>3</th>
				<td>Tor</td>
				<td>IN, OH</td>
			</tr>
			<tr>
				<th>7</th>
				<td>Svr</td>
				<td>IN, OH, KY, TN</td>
			</tr>
		</tbody>
	</table>
</div>


<script>

</script>
</body>

</html>
